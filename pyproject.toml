[build-system]
requires = ["uv_build==0.12.19"]
build-backend = "uv_build"

[project]
name = "nomusic"
version = "0.2.0"
description = "Local source separation backend for the nomusic browser extension"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi==0.141.1",
  "uvicorn[standard]==0.54.0",
  "pydantic==2.13.5",
  # allow_private_network requires Starlette >=0.51.0.
  "starlette==1.7.0",
  "yt-dlp[default]==2026.8.19",
  "yt-dlp-ejs==0.8.0",
  "soundfile==0.14.0",
  "numpy==2.2.6",
  "torch==2.14.0",
  # Demucs 4.1 inference no longer needs torchaudio or training dependencies.
  "demucs==4.1.0",
  "huggingface-hub==2.0.0",
  "safetensors==0.8.0",
  "PyYAML==6.0.3",
]

[project.optional-dependencies]
cpu = ["torch==2.14.0"]
cu126 = ["torch==2.14.0"]

[project.scripts]
nomusic = "nomusic.__main__:main"
nomusic-process = "nomusic.cli:main"

[dependency-groups]
dev = ["pytest==9.1.1", "httpx==0.28.1", "uv_build==0.12.19"]

[tool.uv.build-backend]
module-root = "backend"
module-name = "nomusic"

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
addopts = ["--import-mode=importlib"]

[tool.uv]
required-version = ">=0.12.19"
conflicts = [[{ extra = "cpu" }, { extra = "cu126" }]]
environments = [
  "sys_platform == 'linux' and platform_machine == 'x86_64'",
  "sys_platform == 'darwin' and platform_machine == 'arm64'",
]
required-environments = [
  "sys_platform == 'linux' and platform_machine == 'x86_64'",
  "sys_platform == 'darwin' and platform_machine == 'arm64'",
]

[tool.uv.sources]
torch = [
  { index = "pytorch-cpu", extra = "cpu", marker = "sys_platform == 'linux'" },
  { index = "pytorch-cu126", extra = "cu126", marker = "sys_platform == 'linux'" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true
