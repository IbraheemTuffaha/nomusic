name: Verify local CPU baseline

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      UV_PROJECT_ENVIRONMENT: ${{ github.workspace }}/backend/.venv
      HF_HOME: ${{ github.workspace }}/mds/ci-models
      HF_HUB_CACHE: ${{ github.workspace }}/mds/ci-models/hub
      HF_HUB_DISABLE_TELEMETRY: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.19.0'
          package-manager-cache: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: '0.12.19'
          enable-cache: false
      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y ffmpeg
      - name: Install locked application and test dependencies
        run: |
          uv sync --locked --no-editable --reinstall-package nomusic --python 3.12.14 --group dev
          npm ci --prefix tests/e2e
          tests/e2e/node_modules/.bin/playwright install --with-deps chromium
      - name: Fetch and verify pinned public model
        run: backend/.venv/bin/nomusic models fetch
      - name: Verify suites and real extension with CPU inference
        run: backend/.venv/bin/python scripts/verify.py
      # Evidence remains local: do not upload profiles, traces, caches or media.
